# cargo-nextest, which `.githooks/checks test` uses when it is installed.

[profile.default]
# Run every test, as `cargo test --no-fail-fast` would, so one failure
# doesn't hide the rest.
fail-fast = false
# A hung test is ended instead of holding the run (flagged at 60s, ended at
# 180s); the checks script stops whatever tmux it left.
slow-timeout = { period = "60s", terminate-after = 3 }
