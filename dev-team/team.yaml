# A development team: a lead and four helper roles it starts on demand.
# The folder given at `brg create dev-team <folder>` is the shared checkout.
# Each implementer copy gets a folder brg creates empty under copies/;
# the lead makes copies/ once and prepares a worktree before each brief.
# See README.md.
#
# Every member uses `vendor` posture: the bus doesn't support `locked`
# members yet. Each member file names both vendors' models, so moving a
# member to the other vendor is a change to its `vendor:` line here.
#
# The lead seats the design panel, a separate team (../dev-design-team), as
# its own instance before costly-to-reverse design choices.
default: claude
bus: {}

roles:
  lead:
    prompt: orchestrator.md
    vendor: claude      # a Codex lead needs a wake mechanism brg doesn't have yet
    start: true
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 2
    cwd: copies/{member_id}
  reviewer:
    prompt: reviewer.md
    vendor: claude
    parent: lead
    start: false
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    args: [--search]    # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
