# The design panel for the development team in ../dev-team: two designers,
# one per vendor, each writing an independent proposal from the same blind
# brief. The dev-team lead starts and stops it by its own deployment file; see
# ../dev-team/README.md. No bus: designers exchange files with the lead
# (questions, answers, proposals) in a design directory.
members:
  designer-claude:
    prompt: designer.md
    vendor: claude
    start: true
  designer-codex:
    prompt: designer.md
    vendor: codex
    start: true
