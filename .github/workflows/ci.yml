name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: tmux version
        run: tmux -V
      - uses: astral-sh/setup-uv@v6
      - name: Toolchain
        run: rustup show active-toolchain
      - run: .githooks/checks fmt
      - run: .githooks/checks clippy
      - run: .githooks/checks test
      - name: No tmux sockets left behind
        run: |
          left=$(ls "/tmp/tmux-$(id -u)" 2>/dev/null | grep '^brg-' || true)
          [ -z "$left" ] || { echo "the tests left these tmux sockets: $left"; exit 1; }

  slackbot-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: .githooks/checks py
