name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Hosted runners retain their existing execution limits; local checks use cargo-slot.
env:
  CHECKS_WRAP: env

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: tmux version
        run: tmux -V
      - uses: astral-sh/setup-uv@v6
      - name: Toolchain
        run: rustup show active-toolchain
      - run: .githooks/checks fmt
      # The shared checks build/lint/test every Cargo workspace member.
      - run: .githooks/checks clippy
      # The runner has no tmux servers of its own: after the tests, there
      # must be none, and no new file in tmux's default socket directory.
      - name: Before the tests
        run: |
          mkdir -p "$RUNNER_TEMP/brg-tests"
          ls -A "/tmp/tmux-$(id -u)" 2>/dev/null | sort > "$RUNNER_TEMP/tmux-before.txt" || true
      - run: .githooks/checks test
        env:
          TMPDIR: ${{ runner.temp }}/brg-tests
      - name: No tmux left behind
        if: always()
        run: |
          fail=0
          ls -A "/tmp/tmux-$(id -u)" 2>/dev/null | sort > "$RUNNER_TEMP/tmux-after.txt" || true
          new=$(comm -13 "$RUNNER_TEMP/tmux-before.txt" "$RUNNER_TEMP/tmux-after.txt")
          [ -z "$new" ] || { echo "new in /tmp/tmux-$(id -u): $new"; fail=1; }
          socks=$({ find "$RUNNER_TEMP/brg-tests" -type s; find /tmp/ -maxdepth 4 -path '*/brg*' -type s; } 2>/dev/null || true)
          [ -z "$socks" ] || { echo "tmux sockets left: $socks"; fail=1; }
          procs=$(pgrep -x tmux || true)
          [ -z "$procs" ] || { echo "tmux servers still running:"; ps -o pid,args -p $(echo $procs | tr ' ' ',') || true; fail=1; }
          exit $fail

  slackbot-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: .githooks/checks py
