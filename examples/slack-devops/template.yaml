# A triager reads new posts and replies from one channel, then promotes the
# ones that need a lead. Both are locked and run only granted Slack actions.
default: claude

plugins:
  slack:
    process: [brg-slack, watch]
    delivers_to: triager
    env:
      SLACK_BOT_TOKEN:                 # export in the shell you run brg from
      SLACK_CHANNEL_ID: C0000EXAMPLE   # replace with your channel's ID
    actions:
      read: brg-slack read <ts>
      thread: brg-slack thread <ts>
      reply: brg-slack reply <thread_ts> <text>
      promote: brg-slack promote <ts> <reason>

roles:
  triager:
    prompt: triager.md
    parent: lead
    posture: locked
    untrusted_input: true
    plugins: {slack: [read, thread, promote]}
  lead:
    prompt: lead.md
    posture: locked
    untrusted_input: true
    plugins: {slack: [read, thread, reply]}
