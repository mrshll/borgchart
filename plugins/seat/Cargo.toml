[package]
name = "brg-seat"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
borgchart = { path = "../.." }
clap = { version = "4.6", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []

[[bin]]
name = "brg-seat"
path = "src/main.rs"

[[bin]]
name = "fake-usage"
path = "tests/support/fake_usage_main.rs"
required-features = ["test-support"]
