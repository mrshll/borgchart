[package]
name = "brg-slack"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
borgchart = { path = "../.." }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
