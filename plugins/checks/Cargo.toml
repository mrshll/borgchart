[package]
name = "brg-checks"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
borgchart = { path = "../.." }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
