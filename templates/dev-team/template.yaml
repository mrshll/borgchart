# A development team: a lead with implementers, reviewers, a researcher and a monitor it starts on demand.
default: claude
includes: catalog:shared/includes

plugins:
  github:
    actions:
      read: brg-github read <id>
  timer:
    process: [brg-timer, run]
    actions:
      alarm-set: brg-timer alarm set <when> <note>
      alarm-show: brg-timer alarm show
      alarm-clear: brg-timer alarm clear
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    description: "Owns the team's task, plan, branches, integration and pull requests."
    plugins: {seat: [route], timer: [alarm-set, alarm-show, alarm-clear], github: [read]}
    prompt: orchestrator.md
    interactive: true
    vendor: claude      # Claude leads end turns with a background msg wait
    start: true
  implementer:
    description: "One bounded, written change per member; writes only its own worktree and commits locally."
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 4
    worktree: true
  reviewer:
    description: "One independent review pass; reads the checkout read-only, works in its own scratch clone, writes a report."
    max: 2
    prompt: reviewer.md
    vendor: claude
    parent: lead
    start: false
  researcher:
    description: "One web or code research question; read-only, reports only."
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    args: [--search]    # Codex's web search
  monitor:
    description: "One watch (observation, interval, deadline, trigger); read-only, reports only."
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
