# A development team: a lead with implementers, a reviewer, a researcher and a monitor it starts on demand.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route]}
    prompt: orchestrator.md
    interactive: true
    vendor: claude      # inbox-only lead; Claude uses a background msg wait
    start: true
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 4
    worktree: true
  reviewer:
    prompt: reviewer.md
    vendor: claude
    parent: lead
    start: false
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    args: [--search]    # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
