# A development team: a lead with implementers, reviewers, a researcher and a monitor it starts on demand.
default: claude
includes: catalog:shared/includes

plugins:
  timer:
    process: [brg-timer, run]
    actions:
      alarm-set: brg-timer alarm set <when> <note>
      alarm-show: brg-timer alarm show
      alarm-clear: brg-timer alarm clear
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route], timer: [alarm-set, alarm-show, alarm-clear]}
    prompt: orchestrator.md
    interactive: true
    vendor: claude      # lead ends turns with an alarm and, on Claude, a background msg wait
    start: true
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 4
    worktree: true
  reviewer:
    max: 2
    prompt: reviewer.md
    vendor: claude
    parent: lead
    start: false
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    args: [--search]    # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
