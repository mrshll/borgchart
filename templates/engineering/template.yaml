# An owner's engineering team: a root lead with dev child teams, design panels, solo implementers, researchers and monitors.
default: claude
includes: catalog:shared/includes

plugins:
  github:
    process: [brg-github, run]
    # This team's lead. brg-github sends PR notices to the dev team's lead whose
    # checkout holds the branch or commit; this lead gets everything else,
    # a copy of each approval, and intake-gap notices.
    delivers_to: lead
    # env:
    #   GITHUB_REPOSITORIES: example-org/widgets example-org/*
    actions:
      read: brg-github read <id>
  timer:
    process: [brg-timer, run]
    actions:
      alarm-set: brg-timer alarm set <when> <note>
      alarm-show: brg-timer alarm show
      alarm-clear: brg-timer alarm clear
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    description: "The root lead: takes the owner's requests and runs the team's child teams and helpers."
    plugins: {seat: [route], timer: [alarm-set, alarm-show, alarm-clear], github: [read]}
    prompt: lead.md
    interactive: true
    vendor: claude
    remote_control: true
    start: true
  dev:
    description: "A dev team for one product topic; its lead plans, builds, reviews and hands off pull requests."
    template: dev-team
    parent: lead
    start: false
    max: 6
    worktree: true
  design:
    description: "A design panel for a costly-to-reverse choice: two designers, one per vendor, propose independently."
    template: dev-design-team
    parent: lead
    start: false
    max: 3
  implementer:
    description: "One small, settled change you expect to accept at a glance; commits locally in its own worktree."
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 3
    worktree: true
  researcher:
    description: "One web or code research question; read-only, reports only."
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    max: 6
    args: [--search]        # Codex's web search
  monitor:
    description: "One watch (observation, interval, deadline, trigger); read-only, reports only."
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    max: 6
