# An owner's engineering team: a root lead with dev child teams, design panels, solo implementers, researchers and monitors.
default: claude
includes: catalog:shared/includes

plugins:
  checks:
    process: [brg-checks, run]
    actions:
      alarm-set: brg-checks alarm set <when> <note>
      alarm-show: brg-checks alarm show
      alarm-clear: brg-checks alarm clear
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route], checks: [alarm-set, alarm-show, alarm-clear]}
    prompt: lead.md
    interactive: true
    vendor: claude
    remote_control: true
    start: true
  dev:
    template: dev-team
    parent: lead
    start: false
    max: 6
    worktree: true
  design:
    template: dev-design-team
    parent: lead
    start: false
    max: 3
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 3
    worktree: true
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    max: 6
    args: [--search]        # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    max: 6
