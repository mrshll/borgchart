# The team an owner's engineering runs under, at the root of a tree
# of teams: a root lead that runs the engineering effort, with dev teams,
# design panels, researchers and monitors as its roles. Dev teams and
# design panels are child teams: `create` makes a child team stopped, the lead
# checks seating, then starts it.
#
# The team's folder is the repository, or a plain folder of clones: the
# lead, researchers, monitors and design panels work in it. Each dev team
# works in its own git worktree, which brg adds when the child team is created
# (from a named clone with `--repo`, one child team per repository) and removes
# when it is deleted.
#
# The lead is Claude in `vendor` posture. Codex vendor members also have
# full host access and no tool approvals. The inbox-only lead
# uses a background msg wait.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route]}
    prompt: lead.md
    interactive: true
    vendor: claude
    start: true
  dev:
    template: dev-team
    parent: lead
    start: false
    max: 6
    worktree: true
  design:
    template: dev-design-team
    parent: lead
    start: false
    max: 3
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    max: 6
    args: [--search]        # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    max: 6
