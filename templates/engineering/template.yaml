# An owner's engineering team: a root lead with dev child teams, design panels, solo implementers, researchers and monitors.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route]}
    prompt: lead.md
    interactive: true
    vendor: claude
    start: true
  dev:
    template: dev-team
    parent: lead
    start: false
    max: 6
    worktree: true
  design:
    template: dev-design-team
    parent: lead
    start: false
    max: 3
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 3
    worktree: true
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    max: 6
    args: [--search]        # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    max: 6
