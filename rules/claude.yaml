# State rules for Claude Code, written from screens recorded through tmux
# (Claude Code 2.1.318; the named-session label on the input box's top rule,
# `──── name ─`, seen in 2.1.322). Higher priority wins; no match means
# `unknown`.
# Each rule needs positive evidence, anchored on the UI's own layout.
vendor: claude
# What `status` shows a working member doing: Claude Code titles its terminal
# with a status glyph and its own short summary of the session's topic
# (`Claude Code` until it has one).
activity:
  title: '^\S (.+)$'
  none: ['^Claude Code$']
rules:
  - id: permission-dialog
    state: blocked
    priority: 100
    bottom: 30
    all: ['^ Do you want to proceed\?$']
    any: ['^ Esc to cancel']
  - id: trust-dialog
    state: blocked
    priority: 100
    bottom: 30
    all: ['^ +(❯ )?Yes, I trust this folder$', '^ Enter to confirm · Esc to cancel$']
  # The rules below read the input box: its top rule (ending in the
  # session's name when it has one), a `❯` line, indented draft lines, its
  # closing rule, then only indented footer lines to the end of the screen.
  # What sits directly above and below that box decides, so
  # draft and transcript text can't pass for UI, and a screen whose box (or
  # the line above it) is cut off reads `unknown`, not idle.
  - id: working-spinner
    # The spinner line directly above the box (only indented or blank lines,
    # such as tips, effort and todos, between): a glyph at column 0, a verb
    # ending in `…`, then optionally `(12s · ↓ 1.3k tokens · …)`. It shows in
    # every permission mode, editor mode and width, unlike the footer's
    # `esc to interrupt` (absent in vim insert and auto mode) or a spinner
    # title (2.1.318 keeps `✳`). `●`, the reduced-motion glyph, is also a
    # reply's bullet, so with it the timer `(12s …)` is required.
    state: working
    priority: 50
    bottom: 1000
    any: ['^(?:[·✢✳✶✻✽*] [^\s…][^…\n]*…(?: \([^)\n]*\))?|● [^\s…][^…\n]*… \([^)\n]*\b\d+s\b[^)\n]*\))[ \t]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}(?: [^\n]*\S ─+)?[ \t]*\n❯[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}[ \t]*(?:\n(?:[ \t][^\n]*)?)*\z']
  - id: working-footer
    # The footer line below the box's closing rule, with `esc to interrupt`
    # among its `·`-separated items (mode, PR link, agent count, …).
    state: working
    priority: 50
    bottom: 1000
    any: ['^─{3,}(?: [^\n]*\S ─+)?[ \t]*\n❯[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}[ \t]*(?:\n(?:[ \t][^\n]*)?)*\n  (?:[^\n]* · )?esc to interrupt(?: · [^\n]*)?[ \t]*(?:\n(?:[ \t][^\n]*)?)*\z']
  - id: working-title
    state: working
    priority: 50
    title: '^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] '
  - id: idle-composer
    # The idle title plus a whole box with a column-0 line (a done line, the
    # reply, the banner) as the nearest line above it. A reduced-motion
    # `● Verb…` there, with no timer, could be either, so it reads unknown.
    state: idle
    priority: 10
    title: '^\x{2733} '
    bottom: 1000
    all: ['^\S[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}(?: [^\n]*\S ─+)?[ \t]*\n❯[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}[ \t]*(?:\n(?:[ \t][^\n]*)?)*\z']
    none: ['^● [^\s…][^…\n]*…[ \t]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}(?: [^\n]*\S ─+)?[ \t]*\n❯[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*─{3,}[ \t]*(?:\n(?:[ \t][^\n]*)?)*\z']
