# State rules for Codex, written from screens recorded through tmux
# (codex-cli 0.165.0). Higher priority wins; no match means `unknown`.
# The working bullet alternates between • and ◦.
vendor: codex
rules:
  - id: approval-title
    state: blocked
    priority: 100
    title: '^\[ \. \] Action Required'
  - id: approval-footer
    state: blocked
    priority: 100
    bottom: 8
    any: ['^  Press enter to confirm or esc to cancel\s*$']
  - id: update-dialog
    # The startup "Update available" prompt. brg launches members with
    # `check_for_update_on_startup=false`; this catches it if it shows anyway.
    # Its footer must be the last line on screen, so quoted text can't match.
    state: blocked
    priority: 100
    bottom: 12
    all: ['^  Update available · \S+ → \S+\s*$', '^[› ] 1\. Update now', '^  enter continue · esc skip[ \t]*\z']
  - id: working-title
    state: working
    priority: 50
    title: '^[\x{2800}-\x{28FF}] '
  - id: working-status
    state: working
    priority: 50
    bottom: 12
    any: ['^[•◦] Working \(.*esc to interrupt\)\s*$']
  - id: idle-footer
    state: idle
    priority: 10
    bottom: 3
    any: ['^  (← for agents · )?\? for shortcuts']
