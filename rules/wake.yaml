# Verified CLI versions behind status notices. An unlisted version gets a
# notice; message delivery is not disabled by this list.
# Add newly verified versions after the full live suite passes.
#
#   version:    an exact version (`0.165.0`), or a prefix ending in `.*`
#               (`2.1.*` matches 2.1.318, not 2.10.0). The first match wins.
#   self_wake:  parsed metadata; does not control message delivery.
#   methods:    validated, nonempty, distinct method names (queue or typed);
#               does not select or order message delivery methods.
wake:
  - vendor: claude
    version: "2.1.*"
    self_wake: true
    methods: [typed]
  - vendor: codex
    version: "0.165.0"
    self_wake: false
    methods: [queue]
  - vendor: codex
    version: "0.170.0"
    self_wake: false
    methods: [queue]
  - vendor: codex
    version: "0.171.0"
    self_wake: false
    methods: [queue]
  - vendor: codex
    version: "0.172.0"
    self_wake: false
    methods: [queue]
