# A development team: a lead and four helper roles it starts on demand. The
# lead, reviewer, researcher and monitor work in the instance's folder, a
# checkout of the repository. Each implementer copy works in its own git
# worktree, which brg adds from that checkout when it creates the copy. It
# runs standalone (`brg create ./teams/dev-team` in a checkout) or as a child
# team, the `dev` role of the engineering team, where its folder is the
# copy's worktree and its lead's parent is the root lead.
#
# Every member here uses `vendor` posture. Each member file names both vendors' models, so moving a
# member to the other vendor is a change to its `vendor:` line here.
#
# The lead checks seating with the `brg-seat route` plugin action before each launch.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route]}
    prompt: orchestrator.md
    interactive: true
    vendor: claude      # inbox-only lead; Claude uses a background msg wait
    start: true
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 4
    worktree: true
  reviewer:
    prompt: reviewer.md
    vendor: claude
    parent: lead
    start: false
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    args: [--search]    # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
