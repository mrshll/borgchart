# A development team: a lead and four helper roles it starts on demand. In the instance's folder, `repo/` is the
# shared checkout (a git worktree) where the lead, reviewer, researcher and
# monitor work. Each implementer copy gets a folder brg creates empty under
# `copies/`, beside `repo/`; the lead makes `copies/` once and prepares a
# worktree there before each brief. It runs standalone
# (`brg create ./teams/dev-team <folder>`, with the
# worktree at `<folder>/repo`) or as a child team, the `dev` role of
# borgchart-engineering, where its lead's parent is the root lead.
#
# Every member here uses `vendor` posture. Each member file names both vendors' models, so moving a
# member to the other vendor is a change to its `vendor:` line here.
#
# The lead checks seating with the `brg-seat route` plugin action before each launch.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route]}
    prompt: orchestrator.md
    interactive: true
    vendor: claude      # inbox-only lead; Claude uses a background inbox wait
    start: true
    cwd: repo
  implementer:
    prompt: implementer.md
    vendor: codex
    parent: lead
    start: false
    max: 4
    cwd: copies/{member_id}
  reviewer:
    prompt: reviewer.md
    vendor: claude
    parent: lead
    start: false
    cwd: repo
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    cwd: repo
    args: [--search]    # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    cwd: repo
