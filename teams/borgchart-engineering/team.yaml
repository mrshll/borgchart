# The team this repository's engineering runs under, at the root of a tree
# of teams: a root lead that runs the engineering effort, with dev teams,
# design panels, researchers and monitors as its roles. Dev teams and
# design panels are child teams: `create` makes a copy stopped, the lead
# prepares its folder and checks seating, then starts it.
#
# The lead is Claude in `vendor` posture. Codex vendor members also have
# full host access and no tool approvals. The inbox-only lead
# uses a background inbox wait.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    actions:
      route: brg-seat route <vendor> <model>

roles:
  lead:
    plugins: {seat: [route]}
    prompt: lead.md
    interactive: true
    vendor: claude
    start: true
    cwd: lead               # a checkout of the repository, made before `brg create`
  dev:
    team: dev-team
    parent: lead
    start: false
    max: 4
    cwd: dev/{member_id}
  design:
    team: dev-design-team
    parent: lead
    start: false
    max: 2
    cwd: design/{member_id}
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    max: 3
    cwd: lead
    args: [--search]        # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    max: 3
    cwd: lead
