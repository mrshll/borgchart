# The team this repository's engineering runs under, at the root of a tree
# of teams: a root lead that runs the engineering effort, with dev teams,
# design panels, researchers and monitors as its roles. Dev teams and
# design panels are child teams: `create` makes a copy stopped, the lead
# prepares its folder and checks seating, then starts it. See README.md.
#
# The lead is Claude in `vendor` posture: managing copies needs a vendor
# that lets brg write its state and start members. The inbox-only lead
# uses a background inbox wait. This team's researchers and monitors use the
# shared researcher/monitor instructions; common and dev-only rules each
# live once in the catalog shared includes.
default: claude
includes: catalog:shared/includes

plugins:
  seat:
    path: catalog:shared/plugins/seat
    actions:
      route: seat route <vendor> <model>

roles:
  lead:
    prompt: lead.md
    interactive: true
    vendor: claude
    start: true
    cwd: lead               # a checkout of the repository, made before `brg create`
    plugins: {seat: [route]}
  dev:
    team: dev-team
    parent: lead
    start: false
    max: 4
    cwd: dev/{member_id}
  design:
    team: dev-design-team
    parent: lead
    start: false
    max: 2
    cwd: design/{member_id}
  researcher:
    prompt: researcher.md
    vendor: codex
    parent: lead
    start: false
    max: 3
    cwd: lead
    args: [--search]        # Codex's web search
  monitor:
    prompt: monitor.md
    vendor: claude
    parent: lead
    start: false
    max: 3
    cwd: lead
