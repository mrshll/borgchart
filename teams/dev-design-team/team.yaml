# The design panel: two designers, one per vendor, each writing an
# independent proposal from the same blind brief. It is a child team:
# borgchart-engineering's `design` role. Its parent creates a copy stopped,
# starts it, and deletes it after; the designers read the code in the
# parent's checkout and change none of it. See ../borgchart-engineering/lead.md. Designers exchange files with the lead (the
# brief, questions, answers, proposals) in the copy's notes folder. The
# runtime tree shares one message store.

roles:
  designer-claude:
    prompt: designer.md
    vendor: claude
    start: true
  designer-codex:
    prompt: designer.md
    vendor: codex
    start: true
